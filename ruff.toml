# Explicit rule selection: ruff 0.16.0 (2026-07-22) widened the
# `ruff check` defaults and turned the lint red overnight on PRs that
# touched no Python at all (PR #321). Locking the set here means a new
# ruff release can't change what we enforce; bumps to this list are
# deliberate. E4/E7/E9/F are the pre-0.16 defaults; I (import sorting)
# added on purpose: mechanical, and the whole tree already complies.
[lint]
select = ["E4", "E7", "E9", "F", "I"]
