# Margine: network printers should just appear (2026-08-01).
#
# Fedora ships cups-browsed DISABLED with `BrowseRemoteProtocols none`
# after the 2024 cups-browsed advisory (CVE-2024-47176 chain): safe,
# but it means a fresh install sees "No destinations added" and every
# app offers only Save-to-PDF until the user manually adds a printer
# (real case: the reference host after the 2026-06 reinstall — the
# Brother was on the network, driverless-capable, and invisible).
#
# Margine re-enables ONLY the mDNS/DNS-SD path (avahi), which is not
# the vulnerable legacy CUPS-browsing protocol: that one stays off
# (BrowseRemoteProtocols does NOT include `cups`, so the legacy UDP
# 631 handling never engages). Discovered driverless (IPP Everywhere)
# printers are materialized as normal local queues automatically.
BrowseRemoteProtocols dnssd
BrowseLocalProtocols none
CreateIPPPrinterQueues All

# Fedora's default churn throttles, kept as-is.
UpdateCUPSQueuesMaxPerCall 20
PauseBetweenCUPSQueueUpdates 5
