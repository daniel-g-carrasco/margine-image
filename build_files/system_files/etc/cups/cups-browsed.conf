# Margine: cups-browsed stays OFF, and if you turn it on it will not
# duplicate your printers (2026-08-22).
#
# HISTORY, because this file used to say the opposite.
#
# On 2026-08-01 Margine force-enabled cups-browsed with
# `CreateIPPPrinterQueues All`, to fix a fresh install showing "No
# destinations added". The premise was wrong. CUPS finds driverless
# network printers by itself: avahi-daemon is already enabled by
# Fedora's own preset, nss-mdns is already wired into nsswitch.conf,
# and `lpinfo --include-schemes dnssd -v` lists the printer with no
# help from anyone. Press Ctrl+P and it is there.
#
# What the change actually bought was a SECOND, permanent queue for a
# printer CUPS was already offering, backed by `implicitclass://`,
# which only resolves while cups-browsed is alive and still holding
# its discovery state. On 2026-08-22 that state went stale on the
# reference host and the queue did what it does in that case: accepted
# the job, failed to find a destination, and stopped the printer.
#
#   [Job 2] Backend implicitclass returned status 4 (stop printer)
#   No destination host name supplied by cups-browsed
#
# A print dialog listing the same printer twice, one of which silently
# swallows documents, is worse than the cosmetic problem it was meant
# to solve. The real gap was narrower than it looked: GNOME's Settings
# panel lists configured queues, so a driverless printer is not shown
# THERE until something creates one. The print dialog never had the
# problem.
#
# So: the service is not enabled (Fedora's preset governs, which is
# disabled), and this file survives for the case cups-browsed still
# legitimately serves, a LEGACY CUPS SERVER sharing queues. Enable it
# by hand for that:  sudo systemctl enable --now cups-browsed
#
# BrowseRemoteProtocols dnssd, never `cups`: the legacy UDP 631
# browsing protocol of the CVE-2024-47176 chain stays off.
BrowseRemoteProtocols dnssd
BrowseLocalProtocols none

# No, not All. `All` is what created the duplicate: it makes
# cups-browsed build local queues for IPP network printers, which are
# exactly the ones CUPS already discovers on its own. Remote CUPS
# queues, the thing cups-browsed is still for, are unaffected by this
# setting.
CreateIPPPrinterQueues No

# Fedora's default churn throttles, kept as-is.
UpdateCUPSQueuesMaxPerCall 20
PauseBetweenCUPSQueueUpdates 5
