# Ptyxis follows the Noctalia palette: the template writes a Ptyxis palette
# file (Ptyxis reads user palettes from ~/.local/share/org.gnome.Ptyxis/palettes)
# and the hook selects it in the default profile once. Noctalia has no Ptyxis
# template of its own, built-in or community (5.2.1).
[theme.templates.user.lucciola_ptyxis]
input_path = "/usr/share/lucciola/noctalia/templates/ptyxis.palette"
output_path = "$XDG_DATA_HOME/org.gnome.Ptyxis/palettes/noctalia.palette"
post_hook = "/usr/libexec/lucciola/ptyxis-palette"
