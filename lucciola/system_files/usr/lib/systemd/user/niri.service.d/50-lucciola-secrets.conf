# Fedora 45: the Secret Service is oo7, and only GNOME's session target
# starts it (gnome-session-services.target, Wants=oo7-daemon.service).
# Started with niri, it is up within the two minutes pam_oo7's helper keeps
# the login password, so the Login keyring opens at login as in GNOME.
[Unit]
Wants=oo7-daemon.service
