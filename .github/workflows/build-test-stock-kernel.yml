---
# TEST-ONLY build: Margine with the stock Fedora kernel (Containerfile.test-stock-kernel).
#
# An A/B control for the Ryzen 8745 / Radeon 780M desktop boot hang
# (forum thread .../12247). Builds margine:stable with ONLY the kernel
# reverted to Fedora's, pushes ghcr.io/<owner>/margine:test-stock-kernel.
# A tester rebases to it; if it boots where margine:stable hangs, the
# CachyOS kernel is confirmed as the cause.
#
# Manual only (workflow_dispatch). No MOK signing (Fedora kernel is
# Fedora-signed), no rechunk, no SBOM, no smoke-boot: this is a throwaway
# diagnostic image, not a release. It IS cosign-signed (2026-10-07): it
# lives in the Margine repository, where devices refuse unsigned images
# (#449), and it is built from :stable, so it carries that policy too.

name: Build test image (stock Fedora kernel)

on:
  workflow_dispatch:

env:
  IMAGE_NAME: margine
  TEST_TAG: test-stock-kernel

# Least privilege (Scorecard Token-Permissions): nothing at the workflow
# level; the build_push job declares its own contents:read+packages:write.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build (stock kernel) + push
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Maximize build space
        # margine:stable is ~14 GB; the swap layer + buildah cache need headroom.
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build test image
        run: |
          set -euo pipefail
          sudo -E buildah build \
            --file ./Containerfile.test-stock-kernel \
            --format docker \
            --layers \
            --tag "${IMAGE_NAME}:${TEST_TAG}" \
            .
          sudo buildah images "${IMAGE_NAME}:${TEST_TAG}"

      - name: Push to GHCR
        id: push
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          DEST="ghcr.io/${OWNER,,}/${IMAGE_NAME}:${TEST_TAG}"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo skopeo login \
            -u "${{ github.actor }}" --password-stdin ghcr.io
          sudo skopeo copy --retry-times 3 --digestfile=/tmp/digest.txt \
            "containers-storage:localhost/${IMAGE_NAME}:${TEST_TAG}" \
            "docker://${DEST}"
          DIGEST="$(cat /tmp/digest.txt)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::failed to capture the manifest digest"; exit 1; }
          echo "ref=${DEST%:*}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed: ${DEST} @ ${DIGEST}"
          {
            echo "## Test image pushed"
            echo ""
            echo "\`${DEST}\`"
            echo ""
            echo "Rebase from a working Fedora Atomic / Bluefin DX install:"
            echo '```'
            echo "rpm-ostree rebase ostree-image-signed:docker://${DEST}"
            echo "systemctl reboot"
            echo '```'
            echo ""
            echo "If this boots on hardware where margine:stable hangs, the CachyOS kernel is the cause."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Same two signatures as build.yml (#448): the cosign 3 bundle, and the
      # classic sha256-<digest>.sig that containers/image on the device
      # reads, then a verify of the classic one, so a missing signature fails
      # here instead of on the tester's machine.
      - name: Sign the pushed image (bundle + classic format) and verify
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ""
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REF: ${{ steps.push.outputs.ref }}
        run: |
          set -euo pipefail
          [ -n "$COSIGN_PRIVATE_KEY" ] || { echo "::error::COSIGN_PRIVATE_KEY is not available to this workflow"; exit 1; }
          echo "$GHCR_TOKEN" | cosign login ghcr.io -u "$GHCR_USER" --password-stdin
          echo "Signing: $REF"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$REF"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false "$REF"
          cosign verify --key secrets/cosign.pub --new-bundle-format=false "$REF" > /dev/null
          echo "Signed and verified (classic format, Margine key): $REF"
