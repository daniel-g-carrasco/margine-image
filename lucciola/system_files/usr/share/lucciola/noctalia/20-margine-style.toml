# Lucciola: the look of the first Margine (Arch + Hyprland + Waybar).
# Near-black bar, light grey text, beige active workspace, lavender accents,
# generous spacing; the bar floats a little off the screen ends, as Noctalia
# does by default (checked against screenshots of the Hyprland desktop).
# Palette: palettes/Margine.json (colors from margine-os theme.env).

[theme]
mode = "dark"
source = "custom"
custom_palette = "Margine"

[shell]
corner_radius_scale = 1.0
font_family = "JetBrains Mono"
popup_shadows = false

# Rounded screen corners: the Framework 13 panel already has rounded top
# corners, so the whole screen looks symmetric.
[shell.screen_corners]
enabled = true
size = 26

[shell.panel]
transparency_mode = "solid"
shadow = false
# Floating panels have a complete outline of their own; attached to the bar
# they meet it with concave corners that look broken with a 2px bar outline.
control_center_placement = "floating"
session_placement = "floating"
wallpaper_placement = "floating"

[bar.default]
position = "top"
thickness = 36
background_opacity = 1.0
compositor_blur = false
border = "outline"
border_width = 2.0
shadow = false
radius = 12
radius_top_left = 12
radius_top_right = 12
radius_bottom_left = 12
radius_bottom_right = 12
concave_edge_corners = true
margin_ends = 100
margin_edge = 0
padding = 16
widget_spacing = 14
capsule = false
font_family = "JetBrains Mono"
font_weight = 500
start = ["workspaces", "active_window"]
center = ["clock"]
end = ["tray", "privacy", "network", "bluetooth", "caffeine", "volume", "battery", "notifications", "control-center"]

[widget.workspaces]
style = "minimal"
show_labels = true
label_source = "name"
labels_only_when_occupied = false
# Shows workspaces with windows plus the active one: niri's spare empty
# workspace at the bottom never appears, nor does an unused second one.
hide_when_empty = true
focused_color = "primary"
occupied_color = "on_surface_variant"
empty_color = "outline"

[widget.clock]
format = "{:%a %d %b  %H:%M}"
tooltip_format = "{:%A %d %B %Y}"

# The window title may use the room up to the clock (default stops at 260).
# The bar is 1240px wide with the clock centred, and with six workspace
# labels the title starts ~160px in: 340 leaves a gap before the clock.
[widget.active_window]
max_length = 340
