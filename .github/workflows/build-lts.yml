name: Build Margine LTS variant (experimental, x86-64-v2)
# EXPERIMENTAL, issue #382.
#
# The default Margine kernel (kernel-cachyos) is built for x86-64-v3 and
# hangs at decompression on x86-64-v2 CPUs, before it can print anything;
# a bootc image carries no fallback kernel. This variant is the SAME image
# with kernel-cachyos-lts instead: built for x86-64-v2, sched_ext kept (the
# scheduler picker works), BORE dropped, 6.18 LTS instead of the current
# mainline. MOK-signed with the same key, one enrollment.
#
# Same tier as the NVIDIA variant: manual or weekly, no smoke gate, no
# promotion, no ISO. It pushes :lts (pass another tag for throwaway runs).
# CI has no x86-64-v2 CPU, so a green run proves only that the image builds
# and the kernel is signed; whether it boots on real v2 hardware is what the
# reporter of #382 can tell us.
#
# The image goes through the SAME chunking step as :stable (rpm-ostree
# compose build-chunked-oci, issue #386): a plain buildah build has one
# layer per RUN and shares nothing with the chunked :stable, so switching
# between the two meant re-downloading the whole OS (76 of 77 layers, 8 GB).
# Chunked the same way, the two variants can share every layer whose
# content is identical, which should be everything but the kernel.
on:
  workflow_dispatch:
    inputs:
      chunker:
        description: "Layer chunker: chunkah (default, same as :stable) or rpm-ostree (the way back)"
        type: choice
        options: [chunkah, rpm-ostree]
        default: chunkah
      tag:
        description: "image tag to push (:lts is the one documented; use lts-test for throwaway runs)"
        default: lts
        type: string
  schedule:
    # Sun 06:00 UTC: after the stable build (04:00) and the NVIDIA one
    # (05:00), so the three heavy builds do not compete for runners.
    - cron: '0 6 * * 0'
permissions: {}
concurrency:
  group: build-lts
  cancel-in-progress: true
env:
  IMAGE_NAME: margine
  IMAGE_DESC: "Margine OS, LTS kernel variant for x86-64-v2 CPUs (experimental): kernel-cachyos-lts, MOK-signed"
  IMAGE_KEYWORDS: "bootc,fedora,bluefin,cachyos,lts,x86-64-v2"
  BASE_IMAGE: ghcr.io/ublue-os/bluefin-dx:stable
jobs:
  build-lts:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write   # push the :lts tag to GHCR
    steps:
      - name: Free disk space (the chunker needs a second copy of the image)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h / | tail -1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
      - name: Resolve the tag, the date and the base digest
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG=lts
          [ "${{ github.event_name }}" = push ] && TAG=lts-test
          command -v skopeo >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          DIGEST="$(skopeo inspect --no-tags "docker://${BASE_IMAGE}" --format '{{.Digest}}' 2>/dev/null || echo '')"
          {
            echo "tag=$TAG"
            echo "ymd=$(date -u +%Y%m%d)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "base_digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"
          echo "will push :$TAG, base ${BASE_IMAGE} digest ${DIGEST:-<unresolved>}"
      - name: Stage MOK secrets for BuildKit
        env:
          MOK_KEY: ${{ secrets.MOK_KEY }}
          MOK_CERT: ${{ secrets.MOK_CERT }}
        run: |
          mkdir -p /tmp/margine-secrets
          chmod 700 /tmp/margine-secrets
          printf '%s' "$MOK_KEY"  > /tmp/margine-secrets/MOK.key
          printf '%s' "$MOK_CERT" > /tmp/margine-secrets/MOK.pem
          chmod 600 /tmp/margine-secrets/*
      - name: Build LTS variant (build-arg KERNEL_FLAVOR=lts)
        run: |
          set -euo pipefail
          sudo -E buildah build \
            --file ./Containerfile \
            --format docker \
            --layers \
            --build-arg "KERNEL_FLAVOR=lts" \
            --secret id=mok-key,src=/tmp/margine-secrets/MOK.key \
            --secret id=mok-cert,src=/tmp/margine-secrets/MOK.pem \
            --tag "localhost/${IMAGE_NAME}:lts-build" \
            .
          sudo buildah images "localhost/${IMAGE_NAME}:lts-build"
      - name: Wipe staged secrets
        if: always()
        run: rm -rf /tmp/margine-secrets
      - name: Prove the kernel is the LTS one and is signed
        id: kernel
        run: |
          set -euo pipefail
          IMG="localhost/${IMAGE_NAME}:lts-build"
          KVER="$(sudo podman run --rm --entrypoint /bin/bash "$IMG" -c 'ls /usr/lib/modules')"
          echo "kernel in image: $KVER"
          case "$KVER" in *cachylts*) ;; *) echo "::error::expected a cachylts kernel, got $KVER"; exit 1;; esac
          command -v sbverify >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq sbsigntool; }
          sudo podman run --rm --entrypoint /bin/cat "$IMG" "/usr/lib/modules/$KVER/vmlinuz" | tee /tmp/vmlinuz >/dev/null
          sbverify --list /tmp/vmlinuz | grep -qi "Margine" || { echo "::error::vmlinuz is not signed with the Margine key"; exit 1; }
          echo "vmlinuz signed with the Margine key"
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"
      - name: Chunk the image (same chunker as :stable)
        id: rechunk
        env:
          SRC: localhost/${{ env.IMAGE_NAME }}:lts-build
          CHUNKER: ${{ inputs.chunker || 'chunkah' }}
          CHUNKAH_REF: quay.io/coreos/chunkah:v0.7.0@sha256:8b56578258d1d10d3e1c7b0f71a4d05317c5fde331c4f483576a1b60e65f0cea
          KVER: ${{ steps.kernel.outputs.kver }}
          VERSION: ${{ steps.meta.outputs.tag }}.${{ steps.meta.outputs.ymd }}
          REVISION: ${{ github.sha }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BASE_DIGEST: ${{ steps.meta.outputs.base_digest }}
          CREATED: ${{ steps.meta.outputs.created }}
        run: |
          set -euo pipefail
          # Same invocation and the same chunker as build.yml: :lts must be
          # chunked like :stable or the two share no layers (#386). chunkah by
          # default since 2026-08-31, rpm-ostree kept as the way back.
          OUT_DIR="${RUNNER_TEMP}/chunk-out"
          sudo rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          if [ "$CHUNKER" = "rpm-ostree" ]; then
            mkdir -p "$OUT_DIR/image/blobs/sha256"
            printf '{"imageLayoutVersion":"1.0.0"}' > "$OUT_DIR/image/oci-layout"
            printf '{"schemaVersion":2,"mediaType":"application/vnd.oci.image.index.v1+json","manifests":[]}' \
              > "$OUT_DIR/image/index.json"
          fi
          labels=(
            "org.opencontainers.image.title=${IMAGE_NAME}"
            "org.opencontainers.image.description=${IMAGE_DESC}"
            "org.opencontainers.image.source=https://github.com/${REPO}"
            "org.opencontainers.image.url=https://github.com/${REPO}"
            "org.opencontainers.image.vendor=${OWNER}"
            "org.opencontainers.image.licenses=Apache-2.0"
            "org.opencontainers.image.version=${VERSION}"
            "org.opencontainers.image.revision=${REVISION}"
            "org.opencontainers.image.created=${CREATED}"
            "org.opencontainers.image.base.digest=${BASE_DIGEST}"
            "org.opencontainers.image.base.name=${BASE_IMAGE}"
            "io.artifacthub.package.keywords=${IMAGE_KEYWORDS}"
            "io.artifacthub.package.license=Apache-2.0"
            "io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${REPO}/${REVISION}/README.md"
            "io.artifacthub.package.deprecated=false"
            "io.artifacthub.package.prerelease=true"
            "containers.bootc=1"
            "dev.margine.kernel=${KVER}"
            "dev.margine.kernel-flavor=lts"
            "ostree.bootable=true"
            "ostree.linux=${KVER}"
          )
          label_args=()
          for l in "${labels[@]}"; do
            [ -n "${l#*=}" ] || { echo "::warning::empty label ${l%%=*}, skipping"; continue; }
            label_args+=(--label "$l")
          done
          if [ "$CHUNKER" = "chunkah" ]; then
            for attempt in 1 2 3; do
              sudo podman pull "$CHUNKAH_REF" && break
              echo "chunkah pull attempt $attempt failed, retrying in 10s"; sleep 10
            done
            sudo podman inspect "$SRC" | sudo tee "${OUT_DIR}/config.json" >/dev/null
            # --prune /run/ (2026-10-03): buildah leaves an empty
            # run/systemd/resolve/stub-resolv.conf behind (the mount point it
            # binds the build's resolv.conf onto), with a new mtime on every
            # build, and that one empty file moved the 184 MiB layer of
            # unpackaged files on each update. /run is a tmpfs on every
            # booted system, so nothing in the image's /run is ever visible;
            # 99-cleanup.sh cannot remove it because it is mounted then.
            sudo podman run --rm --pull=never \
              --security-opt label=type:unconfined_t \
              --mount=type=image,src="$SRC",target=/chunkah \
              --volume "${OUT_DIR}:/run/out:Z" \
              -e CHUNKAH_ROOTFS=/chunkah \
              "$CHUNKAH_REF" build \
              --config /run/out/config.json \
              --max-layers 127 \
              --prune /sysroot/ \
              --prune /run/ \
              --label ostree.commit- \
              --label ostree.final-diffid- \
              "${label_args[@]}" \
              --output oci:/run/out/image
          else
            sudo podman run --rm --pull=never --privileged \
              --mount=type=image,src="$SRC",target=/rpm-ostree \
              --volume "${OUT_DIR}:/run/out:Z" \
              --entrypoint /usr/bin/rpm-ostree \
              "$SRC" \
              compose build-chunked-oci \
              --bootc --max-layers 127 --format-version 2 \
              "${label_args[@]}" \
              --rootfs /rpm-ostree \
              --output oci:/run/out/image:latest
          fi
          [ "$(sudo jq '.manifests | length' "${OUT_DIR}/image/index.json")" -gt 0 ] || {
            echo "::error::chunker left ${OUT_DIR}/image without a manifest"
            exit 1
          }
          sudo du -sh "${OUT_DIR}/image"
          echo "ref=oci:${OUT_DIR}/image" >> "$GITHUB_OUTPUT"
          sudo podman rmi -f "$SRC" >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: Push the chunked image
        id: push
        run: |
          set -euo pipefail
          IMG_FULL="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"
          IMG_FULL="${IMG_FULL,,}"
          TAG="${{ steps.meta.outputs.tag }}"
          CREDS="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          # One upload; the dated tag then points at the SAME manifest.
          # Uploading the local image once per tag gave each tag its own
          # manifest (2026-10-07: lts-test and lts-test.20261007 had
          # different digests), and the signature covered only one of them.
          sudo skopeo copy --retry-times 5 --dest-creds="$CREDS" \
            --digestfile=/tmp/digest.txt \
            "${{ steps.rechunk.outputs.ref }}" "docker://${IMG_FULL}:${TAG}"
          DIGEST="$(cat /tmp/digest.txt)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::failed to capture the manifest digest"; exit 1; }
          sudo skopeo copy --retry-times 5 --preserve-digests \
            --src-creds="$CREDS" --dest-creds="$CREDS" \
            "docker://${IMG_FULL}@${DIGEST}" "docker://${IMG_FULL}:${TAG}.${{ steps.meta.outputs.ymd }}"
          for tag in "$TAG" "${TAG}.${{ steps.meta.outputs.ymd }}"; do
            got="$(sudo skopeo inspect --retry-times 3 --no-tags --creds "$CREDS" "docker://${IMG_FULL}:${tag}" --format '{{.Digest}}')"
            [ "$got" = "$DIGEST" ] || { echo "::error::${IMG_FULL}:${tag} is ${got}, not the pushed ${DIGEST}: it would be unsigned"; exit 1; }
          done
          echo "Pushed ${IMG_FULL}:${TAG} and :${TAG}.${{ steps.meta.outputs.ymd }} @ ${DIGEST}: EXPERIMENTAL, not yet booted on real x86-64-v2 hardware."
          echo "ref=${IMG_FULL}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Signing (2026-10-07). This variant was pushed UNSIGNED since it
      # existed: only build.yml had a sign job. Harmless while no device
      # verified anything; fatal once devices enforce the Margine signature
      # (policy scope, #449): every system following this tag on the signed
      # transport would stop updating. Same two signatures as build.yml
      # (#448): the cosign 3 bundle, and the classic sha256-<digest>.sig that
      # containers/image on the device reads, then a verify of the classic
      # one so a missing signature fails here instead of on users' machines.
      - name: Sign the pushed image (bundle + classic format) and verify
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ""
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REF: ${{ steps.push.outputs.ref }}
        run: |
          set -euo pipefail
          [ -n "$COSIGN_PRIVATE_KEY" ] || { echo "::error::COSIGN_PRIVATE_KEY is not available to this workflow"; exit 1; }
          echo "$GHCR_TOKEN" | cosign login ghcr.io -u "$GHCR_USER" --password-stdin
          echo "Signing: $REF"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$REF"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false "$REF"
          cosign verify --key secrets/cosign.pub --new-bundle-format=false "$REF" > /dev/null
          echo "Signed and verified (classic format, Margine key): $REF"
